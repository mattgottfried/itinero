name: Itinero
options:
  bundleIdPrefix: com.matt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: X796Z5UW4P
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 2
targets:
  Itinero:
    type: application
    platform: iOS
    info:
      path: Itinero/Info.plist
      properties:
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Itinero/Itinero.entitlements
      properties:
        com.apple.security.application-groups: [group.com.matt.itinero]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.matt.itinero]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - target: ItineroWidget
    postBuildScripts:
      - name: Stamp build number (Archive only)
        basedOnDependencyAnalysis: false
        script: |
          # The scheme's Archive pre-action writes build/.buildnumber once, so the app and the widget get the same
          # number and every archive is higher than the last (App Store Connect rejects repeats).
          BN="${SRCROOT}/build/.buildnumber"
          if [ "${CONFIGURATION}" = "Release" ] && [ -f "$BN" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(cat "$BN")" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          fi
    sources:
      - Shared
      - Itinero
      # Personal itinerary export, git-ignored. Bundled only if present on this machine.
      - path: private
        includes: ["japan-2026.json"]
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.itinero
        PRODUCT_NAME: Itinero
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Passagio
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Itinero/Itinero.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  ItineroWidget:
    type: app-extension
    platform: iOS
    postBuildScripts:
      - name: Stamp build number (Archive only)
        basedOnDependencyAnalysis: false
        script: |
          # The scheme's Archive pre-action writes build/.buildnumber once, so the app and the widget get the same
          # number and every archive is higher than the last (App Store Connect rejects repeats).
          BN="${SRCROOT}/build/.buildnumber"
          if [ "${CONFIGURATION}" = "Release" ] && [ -f "$BN" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(cat "$BN")" "${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          fi
    sources:
      - Shared/NextUpSnapshot.swift
      - Shared/AppName.swift
      - ItineroWidget
    entitlements:
      path: ItineroWidget/ItineroWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.matt.itinero]
    info:
      path: ItineroWidget/Info.plist
      properties:
        CFBundleDisplayName: Passagio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.itinero.widget
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: ItineroWidget/ItineroWidget.entitlements
  ItineroTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ItineroTests]
    dependencies:
      - target: Itinero
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.itinero.tests
schemes:
  Itinero:
    build:
      targets:
        Itinero: all
      # Build (not Archive) pre-action: Archive pre-actions run after the build. One file, written once per build,
      # so the app and widget share the number; only Release builds (i.e. archives) apply it.
      preActions:
        - name: New build number
          settingsTarget: Itinero
          script: |
            mkdir -p "${SRCROOT}/build" && date +%y%m%d%H%M > "${SRCROOT}/build/.buildnumber"
    test:
      targets: [ItineroTests]
    archive:
      config: Release
