name: TripTrac
options:
  bundleIdPrefix: com.matt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    DEVELOPMENT_TEAM: X796Z5UW4P
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
targets:
  TripTrac:
    type: application
    platform: iOS
    info:
      path: TripTrac/Info.plist
      properties:
        CKSharingSupported: true
        UIBackgroundModes: [remote-notification]
    entitlements:
      path: TripTrac/TripTrac.entitlements
      properties:
        com.apple.security.application-groups: [group.com.matt.triptrac]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.matt.triptrac]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    dependencies:
      - target: TripTracWidget
    sources:
      - Shared
      - TripTrac
      # Personal itinerary export, git-ignored. Bundled only if present on this machine.
      - path: private
        includes: ["japan-2026.json"]
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.triptrac
        PRODUCT_NAME: TripTrac
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TripTrac
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: TripTrac/TripTrac.entitlements
  TripTracWidget:
    type: app-extension
    platform: iOS
    sources:
      - Shared/NextUpSnapshot.swift
      - TripTracWidget
    entitlements:
      path: TripTracWidget/TripTracWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.matt.triptrac]
    info:
      path: TripTracWidget/Info.plist
      properties:
        CFBundleDisplayName: TripTrac
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.triptrac.widget
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: TripTracWidget/TripTracWidget.entitlements
  TripTracTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TripTracTests]
    dependencies:
      - target: TripTrac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.triptrac.tests
schemes:
  TripTrac:
    build:
      targets:
        TripTrac: all
    test:
      targets: [TripTracTests]
