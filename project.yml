name: TripTrac
options:
  bundleIdPrefix: com.matt
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  TripTrac:
    type: application
    platform: iOS
    sources: [TripTrac]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.triptrac
        PRODUCT_NAME: TripTrac
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TripTrac
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  TripTracTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TripTracTests]
    dependencies:
      - target: TripTrac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.matt.triptrac.tests
schemes:
  TripTrac:
    build:
      targets:
        TripTrac: all
    test:
      targets: [TripTracTests]
